# 看板静态托管 + /api 反代。
# 登录由 note-api 的会话 Cookie 负责：nginx 用 auth_request 保护静态资源，
# 未登录时 302 到 login.html。登录页与头像必须公开，否则连登录表单都打不开。
server {
    listen 80;
    server_name _;

    # 跳登录页时不要生成 「主机:80」 的绝对地址：容器内监听 80，
    # 宿主机可能是 8088 或别的端口，绝对地址会把端口带错。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # 登录页自身不能要求登录；头像只是抽象图形，也公开
    location = /login.html { try_files $uri =404; }
    location = /avatar.svg { try_files $uri =404; }

    # 会话校验子请求：204 = 放行，401 = 由下面的 error_page 转到登录页
    location = /_auth {
        internal;
        proxy_pass http://neural-note-api:8787/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态（未登录时不能拿到打包产物）
    location /assets/ {
        auth_request /_auth;
        error_page 401 = @login;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代到 note-api；登录、会话、数据都在这里，鉴权由 note-api 自己完成
    location /api/ {
        proxy_pass http://neural-note-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 问答可能要几十秒
        client_max_body_size 4m;
    }

    # SPA 回退
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ /index.html;
    }

    location @login { return 302 /login.html; }

    # 不做目录列表
    autoindex off;
}
