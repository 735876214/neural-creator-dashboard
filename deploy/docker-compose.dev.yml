# 开发版（本机）：只起 note-api 一个容器，前端用 npm run dev 裸跑。
#
# 用法（两个终端）：
#   终端 1：docker compose -f deploy/docker-compose.dev.yml up -d     # 后端 :8787
#   终端 2：npm run dev                                               # 前端 :5173，/api 自动代理到 8787
#
# 与部署版（docker-compose.yml）的区别：
#   * 只有 note-api，没有 nginx / syncthing / tailscale——开发时不需要它们；
#   * 前端不进容器：vite 的热更新在容器里没法用；
#   * 索引复用仓库里的 .note-api/ 目录（与裸进程运行时同一个 SQLite），
#     而部署版用命名卷。
#
# AI 配置来自 ../.note-api.env（已在 .gitignore，不会提交）。
# 注意：env 里的地址如果写 127.0.0.1，在容器里指的是容器自己——
# 指向宿主机服务时要用 host.docker.internal，局域网设备（如 192.168.0.95）不受影响。
services:
  note-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: neural-note-api-dev
    restart: unless-stopped
    env_file:
      - ../.note-api.env
    environment:
      VAULT_DIR: /vault
      DATA_DIR: /data
      PORT: "8787"
      HOST: 0.0.0.0
      VAULT_GIT: "1"
    volumes:
      - ../notes-vault:/vault
      # 索引用命名卷而不是挂载仓库目录：Docker Desktop 的 Windows 挂载卷（gRPC-FUSE）
      # 跑不了 SQLite（连 CREATE TABLE 都报 disk I/O error）。索引随时可删可重建，
      # 损失的只是 AI 缓存与增量 hash 状态；裸进程（npm run api）仍用 ../.note-api。
      - note-api-dev-data:/data
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  note-api-dev-data:
