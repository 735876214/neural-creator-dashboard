# 看板静态托管 + /api 反代。
# 鉴权用 Basic Auth（.htpasswd），同源请求浏览器会自动带凭据，前端 fetch 零改动。
server {
    listen 80;
    server_name _;

    # 笔记是明文，必须先过认证
    auth_basic "Neural Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 前端静态
    root /usr/share/nginx/html;
    index index.html;

    # /api 反代到 note-api
    location /api/ {
        proxy_pass http://note-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # AI 问答可能要几十秒
        client_max_body_size 4m;
    }

    # 静态资源带缓存指纹，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不做目录列表
    autoindex off;
}
