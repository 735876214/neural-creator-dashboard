# 极空间 compose 功能专用版：不带 build，只用现成镜像 + 绝对路径。
#
# 使用前提（一次性准备）：
#   1. /高速存储/Docker/neura/ 里有：nginx.conf、dist/（本机 npm run build 的产物）、
#      notes-vault/（笔记库）、neural-note-api-0.8.tar.gz（本机导出的镜像包）
#   2. 极空间「镜像管理」导入 neural-note-api-0.8.tar.gz（或在 SSH: docker load -i ...），
#      导入后镜像名应为 neural-note-api，标签 0.8
#   3. 把本文件全文粘贴进极空间的 Compose 编辑框，开始部署
#
# 路径：下面三处 /高速存储/Docker/neura/... 按你的实际目录核对。
# 密码：DASHBOARD_PASSWORD 先填上（极空间日志不好翻），改密码后重新部署即可。
services:
  note-api:
    image: neural-note-api:0.8
    container_name: neural-note-api
    restart: unless-stopped
    environment:
      VAULT_DIR: /vault
      DATA_DIR: /data
      PORT: "8787"
      HOST: 0.0.0.0
      VAULT_GIT: "0"                       # 容器内没挂 git 仓库时关闭自动提交
      MAX_BODY: "4194304"
      # —— AI（可选）：填了 key 剪藏分析 / 问答才可用 ——
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_MODEL: deepseek-chat
      # —— 登录 ——
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: "改成你的密码"     # ← 必填，部署前改掉
      SESSION_DAYS: "30"
    volumes:
      - /高速存储/Docker/neura/notes-vault:/vault
      - /高速存储/Docker/neura/note-api-data:/data
    depends_on: []

  web:
    image: nginx:alpine
    container_name: neural-web
    restart: unless-stopped
    depends_on:
      - note-api
    ports:
      - "8088:80"
    volumes:
      - /高速存储/Docker/neura/dist:/usr/share/nginx/html:ro
      - /高速存储/Docker/neura/nginx-zspace.conf:/etc/nginx/conf.d/default.conf:ro
