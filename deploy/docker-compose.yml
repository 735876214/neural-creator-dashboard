# 部署版：看板 + note-api + Syncthing + Tailscale（本机开发用 docker-compose.dev.yml）
#
# 用法：
#   1. 本机构建前端：npm run build
#   2. 把整个项目目录 + notes-vault/ 放到 NAS，进入 deploy/ 目录：
#        cp .env.example .env
#        htpasswd -bc .htpasswd 用户名
#        docker compose up -d
#   3. 打开 http://<NAS-IP>:8088
#
# .env 会整体注入 note-api；AI、热点、embedding 等变量都从这里读。
services:
  note-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: neural-note-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内固定路径与端口；其余变量（AI / NEWS / EMBED / MAX_BODY…）来自 .env
      VAULT_DIR: /vault
      DATA_DIR: /data
      PORT: "8787"
      HOST: 0.0.0.0
      # vault 是 git 仓库时每次写入自动提交（误写可回滚）；0 关闭
      VAULT_GIT: ${VAULT_GIT:-1}
      # 与 nginx 的 client_max_body_size 4m 对齐（单位：字节）
      MAX_BODY: ${MAX_BODY:-4194304}
      # .env 是共享的；不把 Tailscale 凭据带进 API 容器
      TS_AUTHKEY: ""
    volumes:
      - ../notes-vault:/vault
      - note-api-data:/data
    ports:
      - "127.0.0.1:8787:8787"   # 只绑本机回环，外部一律走 web 反代

  web:
    image: nginx:alpine
    container_name: neural-web
    restart: unless-stopped
    depends_on:
      - note-api
    ports:
      - "8088:80"               # 局域网入口；外网建议走 Tailscale 直接访问这个端口
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Basic Auth：htpasswd -bc deploy/.htpasswd 用户名
      - ./.htpasswd:/etc/nginx/.htpasswd:ro

  syncthing:
    image: syncthing/syncthing
    container_name: neural-syncthing
    restart: unless-stopped
    hostname: nas-vault
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ../notes-vault:/var/syncthing/vault   # 同步的就是明文 vault
      - syncthing-config:/var/syncthing
    ports:
      - "22000:22000/tcp"       # 同步协议
      - "22000:22000/udp"
      - "127.0.0.1:8384:8384"   # 管理界面（只绑回环，SSH 隧道或 Tailscale 里打开）

  tailscale:
    image: tailscale/tailscale
    container_name: neural-tailscale
    restart: unless-stopped
    hostname: neural-dashboard
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --advertise-tags=tag:dashboard
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # 加入你的 Tailnet 后，手机/电脑装 Tailscale 客户端，
    # 访问 http://neural-dashboard:80 即可（web 容器与它同网络时）；
    # 简单起见也可以用 TS_AUTHKEY 起来后在管理台把它当子网路由。
    network_mode: host           # 子网路由模式需要 host 网络

volumes:
  note-api-data:
  syncthing-config:
  tailscale-state:
