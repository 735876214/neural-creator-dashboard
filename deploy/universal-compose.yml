# 通用 compose（单容器版）：粘贴进极空间 Compose 即可部署，无需本地文件、无需预建镜像。
#
# 原理：
#   * build.context 直接写本项目的 GitHub 地址 —— NAS 端 Docker 自己从 GitHub 拉代码构建；
#   * 镜像是多阶段构建（Dockerfile.universal）：第一阶段在容器里 npm build 出前端，
#     最终镜像自带 dist/ 并由 note-api 托管（STATIC_DIR），不需要单独的 nginx 容器；
#   * 所有挂载用绝对路径，指向 /高速存储/Docker/neura/ 下的目录（按需修改）。
#
# 部署前：
#   mkdir -p /高速存储/Docker/neura/notes-vault /高速存储/Docker/neura/data
#   把笔记放进 notes-vault/
#
# 登录：用户 admin，密码在下面的 DASHBOARD_PASSWORD 里改。
# 访问：http://<NAS-IP>:8088（note-api 直接托管看板并自带登录跳转）。
services:
  neural:
    image: neural-dashboard:universal
    build:
      context: https://github.com/735876214/neural-creator-dashboard.git#main
      dockerfile: Dockerfile.universal
    container_name: neural-dashboard
    restart: unless-stopped
    ports:
      - "8088:8787"
    environment:
      PORT: "8787"
      VAULT_DIR: /vault
      DATA_DIR: /data
      VAULT_GIT: "0"
      MAX_BODY: "4194304"
      # —— 登录（必改）——
      DASHBOARD_USER: admin
      DASHBOARD_PASSWORD: "改成你的密码"
      SESSION_DAYS: "30"
      # —— AI（可选）：填 key 后剪藏分析 / 问答可用 ——
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_MODEL: deepseek-chat
      # —— 网页剪藏 ——
      WEB_FETCH_TIMEOUT: "20000"
      WEB_FETCH_MAX_BYTES: "2097152"
    volumes:
      - /高速存储/Docker/neura/notes-vault:/vault
      - /高速存储/Docker/neura/data:/data
