# 部署版：note-api 单容器（前端构建进镜像、由 note-api 自托管）。
# 本机开发用 deploy/docker-compose.dev.yml。
#
# 一键部署：NAS 上只需要 docker-compose.yml（+.env），不需要源码：
#   docker compose up -d
#   打开 http://<NAS-IP>:8088
#
# 镜像由 GitHub Actions 在 push 到 main 时自动构建并发布到 GHCR：
#   ghcr.io/735876214/neural-creator-dashboard:latest
# 更新看板 = 在 NAS 上重新拉取镜像（图形界面点一次，或 docker compose pull && up -d）。
#
# compose / 笔记库放在别处时，在 .env 里覆盖：
#   VAULT_DIR=...
#
# 登录：用户默认 admin。.env 里设置了 DASHBOARD_PASSWORD 就用它；
# 没设置时首次启动自动生成随机密码，用 `docker compose logs note-api` 查看
# （写在容器卷的 auth.json 里，重启沿用；固定密码改 .env 后 force-recreate）。
#
# 数据全部保存在 NAS 本地（vault .md + /data 索引卷），修改入口就是看板前端，
# 不提供外网访问与多设备同步；笔记是明文，请只在局域网内访问。
#
# .env 是可选的：Compose 会自动读取本目录的 .env 并填充下面的 ${VAR}。
# 没有 .env 也能启动（AI / 热点关闭），不会再因为缺少 env 文件而直接失败。
services:
  note-api:
    # GitHub Actions 构建并发布的多阶段镜像（含前端产物 + note-api）。
    # 仓库为 public，GHCR 包默认继承可见性，NAS 拉取无需登录。
    image: ghcr.io/735876214/neural-creator-dashboard:latest
    container_name: neural-note-api
    restart: unless-stopped
    # 与宿主目录属主对齐：镜像里以 node（uid/gid 1000）运行，宿主上的 vault 若属于
    # 别的用户（NAS 共享目录常见），把 PUID/PGID 填成那边的 uid/gid，否则看板写出来的
    # 笔记属于 1000，SMB / Obsidian / 文件管理器里改不动也删不掉。
    user: "${PUID:-1000}:${PGID:-1000}"
    # 容器日志必须限长：Docker 默认 json-file 不轮转，NAS 的系统盘会被日志写满。
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      # 容器内固定路径与端口
      VAULT_DIR: /vault
      DATA_DIR: /data
      PORT: "8787"
      HOST: 0.0.0.0
      # 前端构建产物在镜像内 /app/dist（Dockerfile 里已设 STATIC_DIR），note-api 自托管，
      # 未登录 302 到 login.html。
      # vault 是 git 仓库时每次写入自动提交（误写可回滚）；0 关闭。
      # 镜像里已装 git，并配置了 safe.directory 与提交身份。
      VAULT_GIT: ${VAULT_GIT:-1}
      # 上传/写入请求体上限（字节）
      MAX_BODY: ${MAX_BODY:-4194304}
      # —— 登录（自举：没设密码时首次启动生成随机密码并打印到日志）——
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      AUTH_FILE: /data/auth.json
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # 非浏览器客户端（curl / 脚本）用的 Bearer token。原来这里漏了转发：.env 里写了
      # API_TOKEN 也进不了容器，tokenAuthed() 永远为假，脚本一直 401 且没有任何提示。
      # 浏览器会话不受影响（index.mjs 先试 token，再回落 Cookie）。
      API_TOKEN: ${API_TOKEN:-}
      # —— AI（可选）——
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_PROTOCOL: ${AI_PROTOCOL:-openai}
      AI_TIMEOUT: ${AI_TIMEOUT:-60000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-4}
      AI_MODEL_ASK: ${AI_MODEL_ASK:-}
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-}
      AI_MODEL_IDEAS: ${AI_MODEL_IDEAS:-}
      AI_MODEL_NEWS: ${AI_MODEL_NEWS:-}
      # —— 网页剪藏（个人知识库）——
      WEB_FETCH_TIMEOUT: ${WEB_FETCH_TIMEOUT:-20000}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-2097152}
      # 看板日期基准（「今天是哪天」：作品 date、月目标进度、日报归类）。容器默认 UTC，
      # 不设就是 +8（北京时间）。注意 NEWS_TZ_OFFSET 只管日报生成时刻，DASHBOARD_TZ_OFFSET
      # 优先于它——两者混用会出现「作品记成昨天」这种错日期。
      DASHBOARD_TZ_OFFSET: ${DASHBOARD_TZ_OFFSET:-8}
      # —— AI 热点 ——
      NEWS_SOURCE: ${NEWS_SOURCE:-}
      NEWS_HOUR: ${NEWS_HOUR:-8}
      NEWS_CRON: ${NEWS_CRON:-}
      # —— 平台指标同步（公众号）——
      SYNC_HOUR: ${SYNC_HOUR:-21}
      # 「每天 N 点后同步」按这个时区偏移判定：容器默认 UTC，不设的话默认按 +8 点（北京时间）算
      SYNC_TZ_OFFSET: ${SYNC_TZ_OFFSET:-8}
      # 日报生成时刻（NEWS_HOUR）按同一套偏移判定，默认 +8（北京时间）
      NEWS_TZ_OFFSET: ${NEWS_TZ_OFFSET:-8}
      PLATFORM_SYNC_CRON: ${PLATFORM_SYNC_CRON:-}
      # 反向代理：本机有 Caddy / Traefik / 群晖反代时，把 WEB_BIND 改成 127.0.0.1 并设
      # TRUST_PROXY=1（两者必须同时改）。只设 TRUST_PROXY 而端口仍发布在 0.0.0.0 时，
      # 直连请求可以自带 x-real-ip 伪造来源 IP，把登录限流绕成无限爆破。
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 公众号凭据：也可以不填，改在「设置 → 发布平台」里存进 vault 的 settings.json
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # —— embedding ——
      EMBED_PROTOCOL: ${EMBED_PROTOCOL:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
    volumes:
      # VAULT_DIR：笔记库目录。默认 = compose 目录下的 notes-vault/；
      # 目录不存在时首次启动会自动创建 02-作品库/03-创作台/04-选题池/05-方法库 等标准子目录。
      - ${VAULT_DIR:-./notes-vault}:/vault
      - note-api-data:/data    # 索引、会话密钥、auth.json（没设 DASHBOARD_PASSWORD 时）
    ports:
      # 默认发布到所有网卡；前面挂 HTTPS 反代时改成 WEB_BIND=127.0.0.1:${WEB_PORT:-8088}:8787
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:8787"   # 局域网入口

volumes:
  note-api-data:
